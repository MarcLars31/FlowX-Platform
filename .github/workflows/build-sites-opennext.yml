name: Build FlowX Sites artifact

on:
  workflow_dispatch:
  push:
    branches:
      - Frontend-

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Cloudflare worker
        run: npm run build:cloudflare

      - name: Stage Sites archive
        run: |
          rm -rf dist
          mkdir -p dist/server dist/.openai
          cp -RL .open-next/. dist/server/
          cp .open-next/worker.js dist/server/index.js
          if [ -d .open-next/assets ]; then
            mkdir -p dist/assets
            cp -RL .open-next/assets/. dist/assets/
          fi
          cp .openai/hosting.json dist/.openai/hosting.json
          tar -C . -czf ../../flowx-sites-opennext.tar.gz dist

      - name: Upload Sites archive
        uses: actions/upload-artifact@v4
        with:
          name: flowx-sites-opennext
          path: flowx-sites-opennext.tar.gz
          if-no-files-found: error
          retention-days: 3
